<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Credence Stuff</title>
<link rel="icon" href="images/logo.jpg">
<link rel="apple-touch-icon" href="images/logo.jpg">
<style>
/* Layout concept: editorial bespoke-tailoring site — ink cloth, chalk ivory, a single brass accent;
   asymmetric columns, chalk-line rules, SVG fabric artwork, numbered process as real sequence. */
:root{
  --ink:#1a1b1e;          /* charcoal cloth */
  --ink-2:#26282c;        /* raised panel */
  --chalk:#f4f1ea;        /* warm ivory ground */
  --chalk-2:#e7e2d6;      /* dim ivory */
  --paper:#fbfaf6;        /* card ground */
  --fg:#23242a;           /* body text on light */
  --fg-soft:#5c5d63;      /* muted text */
  --line:#cfc9ba;         /* chalk rule */
  --brass:#a97d3e;        /* restrained brass accent */
  --brass-deep:#8a6530;
  --bg:var(--chalk);
  --surface:var(--paper);
  --card-line:var(--line);
  --header-bg:rgba(244,241,234,.86);
  --shadow:0 1px 2px rgba(26,27,30,.06), 0 10px 30px rgba(26,27,30,.07);
  --logo-filter:none; --logo-blend:multiply;
  color-scheme:light;
  --serif:"Cormorant Garamond", "Hoefler Text", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"Jost", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#0f1011; --ink-2:#17181b;
    --chalk:#141518; --chalk-2:#1d1f23;
    --paper:#1b1d21; --fg:#eceadf; --fg-soft:#a7a69d;
    --line:#3a3c42; --brass:#c79a53; --brass-deep:#a97d3e;
    --bg:var(--chalk); --surface:var(--paper);
    --card-line:#34363c;
    --header-bg:rgba(20,21,24,.86);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
    --logo-filter:invert(1); --logo-blend:screen;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#0f1011; --ink-2:#17181b;
  --chalk:#141518; --chalk-2:#1d1f23;
  --paper:#1b1d21; --fg:#eceadf; --fg-soft:#a7a69d;
  --line:#3a3c42; --brass:#c79a53; --brass-deep:#a97d3e;
  --bg:var(--chalk); --surface:var(--paper);
  --card-line:#34363c;
  --header-bg:rgba(20,21,24,.86);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
  --logo-filter:invert(1); --logo-blend:screen;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--header-bg)}
img{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;text-wrap:balance;line-height:1.05;margin:0}
p{margin:0}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:500}
.rule{height:1px;background:var(--line);border:0;width:100%}
.btn{display:inline-flex;align-items:center;gap:.55em;font-family:var(--sans);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:.95em 1.7em;border-radius:1px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s;background:none}
.btn-primary{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.btn-primary:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.btn-ghost{border-color:currentColor;color:var(--fg)}
.btn-ghost:hover{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn-brass:hover{background:var(--brass-deep);border-color:var(--brass-deep)}

/* ---------- header ---------- */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:76px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--fg);cursor:pointer;background:none;border:0;padding:0}
.brand-mark{height:40px;width:auto;flex:none;display:block;filter:var(--logo-filter,none);mix-blend-mode:var(--logo-blend,multiply)}
@media(max-width:560px){.brand-mark{height:34px}}
.brand-name{font-family:var(--serif);font-size:1.5rem;letter-spacing:.02em;line-height:1}
.brand-sub{display:block;font-family:var(--sans);font-size:.56rem;letter-spacing:.34em;text-transform:uppercase;color:var(--fg-soft);margin-top:.25em}
.nav{display:flex;align-items:center;gap:2px}
.nav a{font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--fg-soft);padding:.6em .9em;border-radius:1px;cursor:pointer;transition:color .2s}
.nav a:hover{color:var(--fg)}
.nav a.active{color:var(--fg)}
.nav a.active::after{content:"";display:block;height:1.5px;background:var(--brass);margin-top:.35em}
.hd-cta{margin-left:.5rem}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:10px}
.burger span{width:24px;height:1.6px;background:var(--fg);transition:.25s}
.mnav{display:none;flex-direction:column;border-top:1px solid var(--line);background:var(--header-bg)}
.mnav a{padding:1em max(22px,env(safe-area-inset-left,0px));text-decoration:none;color:var(--fg);font-family:var(--sans);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--line);cursor:pointer}
@media(max-width:860px){
  .nav,.hd-cta{display:none}
  .burger{display:flex}
  .mnav.open{display:flex}
}

/* ---------- generic section ---------- */
section{position:relative}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{max-width:640px;display:flex;flex-direction:column;gap:1rem;margin-bottom:3rem}
.sec-head h2{font-size:clamp(2rem,4.5vw,3.1rem)}
.lead{font-size:1.08rem;color:var(--fg-soft);max-width:60ch}
.dark-band{background:var(--ink);color:var(--chalk)}
.dark-band .lead{color:#b9b7ac}
.dark-band .eyebrow{color:var(--brass)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--chalk)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:2rem;align-items:center;min-height:min(78vh,640px);padding-block:clamp(48px,7vw,84px)}
.hero h1{font-size:clamp(2.8rem,6.6vw,5.3rem);letter-spacing:.005em;color:var(--chalk)}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero p{color:#c3c1b6;font-size:1.12rem;max-width:44ch;margin-top:1.4rem}
.hero .eyebrow{margin-bottom:1.4rem;display:block}
.hero-cta{display:flex;gap:.9rem;margin-top:2.2rem;flex-wrap:wrap}
.hero-art{position:relative;min-width:0}
.hero-fig{width:100%;height:auto;display:block;border:1px solid rgba(169,125,62,.4)}
.hero-stats{display:flex;gap:2.4rem;margin-top:2.8rem;flex-wrap:wrap}
.hero-stats .n{font-family:var(--serif);font-size:2.1rem;color:var(--brass);line-height:1}
.hero-stats .l{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#9b998f;margin-top:.4em}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:2.4rem}.hero-art{order:-1;max-width:420px}}

/* ---------- feature row / cards ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
@media(max-width:820px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr;gap:1.8rem}.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--card-line);padding:2rem 1.8rem;border-radius:2px;display:flex;flex-direction:column;gap:.8rem;min-width:0}
.card h3{font-size:1.5rem}
.card p{color:var(--fg-soft);font-size:.96rem}
.card .ic{width:40px;height:40px;color:var(--brass);margin-bottom:.4rem}
.swatch{aspect-ratio:1/1;border:1px solid var(--card-line);border-radius:2px;overflow:hidden}
.swatch svg,.swatch img{display:block;width:100%;height:100%;object-fit:cover}

/* numbered process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;counter-reset:step}
@media(max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{display:flex;flex-direction:column;gap:.7rem}
.step .num{font-family:var(--serif);font-size:1rem;color:var(--brass);border-top:1.5px solid var(--brass);padding-top:.7rem;letter-spacing:.1em}
.step h3{font-size:1.25rem}
.step p{color:var(--fg-soft);font-size:.92rem}
.dark-band .step p{color:#b9b7ac}
.dark-band .card{background:var(--ink-2);border-color:#34363c}
.dark-band .card p{color:#b9b7ac}

/* split image/text */
.split-fig{width:100%;border:1px solid var(--card-line);border-radius:2px;display:block}

/* quote */
.quote{font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.6rem);line-height:1.25;font-style:italic;max-width:20ch}
.quote-wrap{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:start}
@media(max-width:680px){.quote-wrap{grid-template-columns:1fr}}
.cite{font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft);margin-top:1.4rem;font-style:normal}

/* price / service list */
.srv{display:flex;flex-direction:column}
.srv-row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:baseline;padding-block:1.5rem;border-bottom:1px solid var(--card-line)}
.srv-row:first-child{border-top:1px solid var(--card-line)}
.srv-row h3{font-size:1.5rem}
.srv-row .desc{color:var(--fg-soft);font-size:.95rem;margin-top:.4rem;max-width:52ch}
.srv-row .price{font-family:var(--serif);font-size:1.5rem;color:var(--brass);white-space:nowrap}
.srv-row .price small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft)}
@media(max-width:560px){.srv-row{grid-template-columns:1fr}}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:220px;gap:1rem}
@media(max-width:820px){.gal{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.gal{grid-template-columns:1fr}}
.gal-item{position:relative;overflow:hidden;border:1px solid var(--card-line);border-radius:2px;background:var(--ink)}
.gal-item svg,.gal-item img{display:block;width:100%;height:100%;object-fit:cover}
.gal-tall{grid-row:span 2}
.gal-cap{position:absolute;left:0;right:0;bottom:0;padding:1rem;background:linear-gradient(transparent,rgba(15,16,17,.82));color:#f4f1ea;font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}

/* testimonial cards */
.tcard{background:var(--surface);border:1px solid var(--card-line);padding:1.9rem;border-radius:2px;display:flex;flex-direction:column;gap:1rem}
.tcard p{font-family:var(--serif);font-size:1.22rem;font-style:italic;line-height:1.35}
.tcard .who{font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft)}
.stars{color:var(--brass);letter-spacing:.2em;font-size:.9rem}

/* faq */
.faq{border-top:1px solid var(--card-line)}
.faq details{border-bottom:1px solid var(--card-line)}
.faq summary{list-style:none;cursor:pointer;padding:1.4rem 0;display:flex;justify-content:space-between;gap:1rem;align-items:center;font-family:var(--serif);font-size:1.3rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{color:var(--brass);font-size:1.4rem;transition:transform .2s;flex:none}
.faq details[open] summary .pm{transform:rotate(45deg)}
.faq .ans{color:var(--fg-soft);padding-bottom:1.4rem;max-width:72ch}

/* CTA band */
.cta-band{background:var(--ink);color:var(--chalk);text-align:center}
.cta-band h2{font-size:clamp(2rem,5vw,3.4rem);color:var(--chalk)}
.cta-band p{color:#b9b7ac;max-width:48ch;margin:1.2rem auto 0}
.cta-inner{display:flex;flex-direction:column;align-items:center;gap:0}

/* booking form */
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;align-items:start}
@media(max-width:820px){.book-grid{grid-template-columns:1fr}}
.form{background:var(--surface);border:1px solid var(--card-line);border-radius:2px;padding:clamp(1.4rem,3vw,2.4rem);display:flex;flex-direction:column;gap:1.1rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field label{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft)}
.field input,.field select,.field textarea{font-family:var(--sans);font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--card-line);border-radius:2px;padding:.8em .9em;width:100%}
.field input:focus,.field select,.field textarea:focus,.field select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.field textarea{resize:vertical;min-height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.form-note{font-size:.8rem;color:var(--fg-soft)}
.ok-msg{background:var(--ink);color:var(--chalk);border:1px solid var(--brass);border-radius:2px;padding:2rem;display:flex;flex-direction:column;gap:.8rem}
.ok-msg h3{color:var(--brass);font-size:1.8rem}
.ok-msg p{color:#c3c1b6}
.err{color:#c0392b;font-size:.78rem}
:root[data-theme="dark"] .err,@media (prefers-color-scheme:dark){.err{color:#e4897f}}

.contact-list{display:flex;flex-direction:column;gap:1.5rem}
.contact-item{display:flex;gap:1rem;align-items:flex-start}
.contact-item .ic{width:26px;height:26px;color:var(--brass);flex:none;margin-top:3px}
.contact-item .k{font-family:var(--sans);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-soft)}
.contact-item .v{font-size:1.05rem;margin-top:.15rem}
.copy-btn{background:none;border:1px solid var(--card-line);border-radius:2px;color:var(--fg-soft);font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.35em .6em;cursor:pointer;margin-left:.6rem}
.copy-btn:hover{color:var(--fg);border-color:var(--brass)}
.hours{border:1px solid var(--card-line);border-radius:2px;padding:1.4rem 1.6rem;margin-top:1.8rem}
.hours-row{display:flex;justify-content:space-between;padding-block:.5rem;border-bottom:1px solid var(--card-line);font-size:.92rem}
.hours-row:last-child{border-bottom:0}
.hours-row span:last-child{color:var(--fg-soft)}
.map-fig{width:100%;border:1px solid var(--card-line);border-radius:2px;display:block;margin-top:1.8rem}

/* footer */
.ft{background:var(--ink);color:#b9b7ac;padding-block:clamp(44px,6vw,70px) 0}
.ft a{color:#b9b7ac;text-decoration:none}
.ft a:hover{color:var(--brass)}
.ft-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:2rem}
@media(max-width:820px){.ft-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.ft-grid{grid-template-columns:1fr}}
.ft h4{font-family:var(--sans);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#e7e2d6;margin:0 0 1.2rem}
.ft-links{display:flex;flex-direction:column;gap:.7rem;font-size:.92rem}
.ft-links a{cursor:pointer}
.ft .brand-name{color:var(--chalk)}
.ft .brand-mark{filter:invert(1);mix-blend-mode:screen;height:46px}
.ft-blurb{font-size:.94rem;max-width:34ch;margin-top:1.2rem}
.ft-bottom{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid #34363c;margin-top:3rem;padding-block:1.6rem;font-size:.78rem;color:#86857c}
.ft-mark{display:flex;align-items:center;gap:.7rem}

.page-hero{background:var(--ink-2);color:var(--chalk);border-bottom:1px solid #34363c}
.page-hero .wrap{padding-block:clamp(56px,8vw,92px)}
.page-hero h1{font-size:clamp(2.4rem,5.5vw,4rem);color:var(--chalk);max-width:16ch}
.page-hero p{color:#b9b7ac;max-width:52ch;margin-top:1.2rem;font-size:1.08rem}
.crumb{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:1.2rem}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

.feat-list{display:flex;flex-direction:column;gap:1.1rem}
.feat-list .fi{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start}
.feat-list .fi .ic{width:22px;height:22px;color:var(--brass);margin-top:4px;flex:none}
.feat-list .fi h3{font-size:1.15rem;margin-bottom:.2rem}
.feat-list .fi p{color:var(--fg-soft);font-size:.92rem}
.mini-cta{display:inline-flex;align-items:center;gap:.5em;color:var(--brass);font-family:var(--sans);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-top:.4rem}
.mini-cta:hover{color:var(--brass-deep)}
</style>

/* reveal-on-scroll hook */
function useReveal(){
  const ref=useRef(null);
  useEffect(()=>{
    const els=ref.current?.querySelectorAll(".reveal")||[];
    if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return;}
    const io=new IntersectionObserver((ents)=>ents.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}}),{threshold:.12});
    els.forEach(e=>io.observe(e));
    return ()=>io.disconnect();
  });
  return ref;
}

function Book(){
  const ref=useReveal();
  const [sent,setSent]=useState(false);
  const [errs,setErrs]=useState({});
  const [copied,setCopied]=useState("");
  const [form,setForm]=useState({name:"",email:"",phone:"",service:"Bespoke Two-Piece",date:"",time:"Morning",notes:""});
  const set=(k)=>(e)=>setForm(f=>({...f,[k]:e.target.value}));
  function copy(text,key){
    const done=()=>{setCopied(key);setTimeout(()=>setCopied(""),1600);};
    try{navigator.clipboard.writeText(text).then(done,()=>fallback());}catch(e){fallback();}
    function fallback(){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(_){}document.body.removeChild(t);}
  }
  function submit(e){
    e.preventDefault();
    const er={};
    if(!form.name.trim())er.name="Please tell us your name.";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email))er.email="Enter a valid email address.";
    if(form.phone.replace(/\D/g,"").length<7)er.phone="Enter a contact number.";
    if(!form.date)er.date="Choose a preferred date.";
    setErrs(er);
    if(Object.keys(er).length===0)setSent(true);
  }
  return h("div",{ref},
    h("section",{className:"page-hero"},h("div",{className:"wrap"},
      h("div",{className:"crumb"},"Book an Appointment"),

            h("p",{style:{fontSize:".85rem"}},"Prefer to speak now? Call +44 7916 690013."),
            h("button",{className:"btn btn-brass",style:{alignSelf:"flex-start",marginTop:".6rem"},onClick:()=>{setSent(false);setForm({name:"",email:"",phone:"",service:"Bespoke Two-Piece",date:"",time:"Morning",notes:""});}},"Book another"))
        : h("form",{className:"form",onSubmit:submit,noValidate:true},
            h("div",{className:"field"},h("label",{htmlFor:"f-name"},"Full name"),
              h("input",{id:"f-name",value:form.name,onChange:set("name"),placeholder:"e.g. Daniel Rowe"}),
              errs.name&&h("span",{className:"err"},errs.name)),
            h("div",{className:"two"},

                h("input",{id:"f-email",type:"email",value:form.email,onChange:set("email"),placeholder:"you@email.com"}),
                errs.email&&h("span",{className:"err"},errs.email)),
              h("div",{className:"field"},h("label",{htmlFor:"f-phone"},"Phone"),
                h("input",{id:"f-phone",type:"tel",value:form.phone,onChange:set("phone"),placeholder:"+44 …"}),
                errs.phone&&h("span",{className:"err"},errs.phone))),
            h("div",{className:"field"},h("label",{htmlFor:"f-service"},"What are you after?"),
              h("select",{id:"f-service",value:form.service,onChange:set("service")},
                ["Bespoke Two-Piece","Bespoke Three-Piece","Made-to-Measure Suit","Occasion & Wedding","Odd Jacket & Trousers","Alterations & Repair","Not sure yet — advise me"]
                .map(o=>h("option",{key:o,value:o},o)))),
            h("div",{className:"two"},
              h("div",{className:"field"},h("label",{htmlFor:"f-date"},"Preferred date"),
                h("input",{id:"f-date",type:"date",value:form.date,onChange:set("date")}),
                errs.date&&h("span",{className:"err"},errs.date)),

/* ---------------- app shell + routing ---------------- */
const ROUTES={home:Home,craft:Craft,services:Services,lookbook:Lookbook,book:Book};
function App(){
  const [route,setRoute]=useState(()=>{const hwish=location.hash.replace("#","");return ROUTES[hwish]?hwish:"home";});
  function go(r){setRoute(r);try{location.hash=r;}catch(e){}window.scrollTo({top:0,behavior:"instant"in document.documentElement.style?"instant":"auto"});}
  useEffect(()=>{
    const on=()=>{const r=location.hash.replace("#","");setRoute(ROUTES[r]?r:"home");window.scrollTo(0,0);};
    window.addEventListener("hashchange",on);return ()=>window.removeEventListener("hashchange",on);
  },[]);
  const Page=ROUTES[route]||Home;
  return h(Fragment,null,
    h(Header,{route,go}),
    h("main",null,h(Page,{go})),
    h(Footer,{go}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
